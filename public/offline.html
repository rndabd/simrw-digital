<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIM-RW Digital - Mode Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.1));
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon {
      width: 40px;
      height: 40px;
      color: #ef4444;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #059669, #0d9488);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
      margin-bottom: 12px;
    }
    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-outline {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
    }
    .server-settings {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }
    .server-settings.active {
      display: block;
    }
    .server-settings label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .server-settings input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
    .server-settings input:focus {
      border-color: #10b981;
    }
    .tip {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span>●</span> SIM-RW Digital
    </div>

    <div class="icon-container">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.88 8.88A9.957 9.957 0 0112 8c2.4 0 4.6.85 6.32 2.26M10.59 13.51A4 4 0 0112 13c1.02 0 1.95.38 2.66 1.01M1.42 9A16.03 16.03 0 0112 5c3.83 0 7.37 1.35 10.15 3.61M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H5a2 2 0 00-2 2v5a2 2 0 002 2z"></path>
      </svg>
    </div>

    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Aplikasi tidak dapat menghubungi server. Pastikan perangkat Anda terhubung ke Wi-Fi atau paket data seluler.</p>

    <button class="btn btn-primary" onclick="retryConnection()">
      Coba Hubungkan Kembali
    </button>

    <button class="btn btn-outline" onclick="toggleServerSettings()">
      ⚙️ Pengaturan Alamat Server
    </button>

    <div id="serverSettings" class="server-settings">
      <label for="serverUrl">Alamat URL Server Produksi:</label>
      <input type="text" id="serverUrl" placeholder="https://simrw.web.id atau http://IP-Debian:3000">
      <button class="btn btn-primary" style="padding: 10px; font-size: 13px;" onclick="saveAndRedirect()">
        Simpan & Kunjungi
      </button>
    </div>

    <p class="tip">💡 Tarik layar ke bawah (pull-to-refresh) kapan saja untuk memperbarui koneksi.</p>
  </div>

  <script>
    const DEFAULT_URL = "https://simrw.web.id";

    // Muat URL tersimpan jika pernah diubah
    const savedUrl = localStorage.getItem("simrw_server_url") || DEFAULT_URL;
    document.getElementById("serverUrl").value = savedUrl;

    function retryConnection() {
      const target = localStorage.getItem("simrw_server_url") || DEFAULT_URL;
      window.location.href = target;
    }

    function toggleServerSettings() {
      const box = document.getElementById("serverSettings");
      box.classList.toggle("active");
    }

    function saveAndRedirect() {
      let val = document.getElementById("serverUrl").value.trim();
      if (!val) val = DEFAULT_URL;
      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "http://" + val;
      }
      localStorage.setItem("simrw_server_url", val);
      window.location.href = val;
    }

    // Auto-reconnect saat perangkat kembali online
    window.addEventListener("online", () => {
      retryConnection();
    });
  </script>
</body>
</html>
